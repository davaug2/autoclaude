name: ask-the-code

x-hardening: &hardening
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  user: "1000:1000"

x-mcp-base: &mcp-base
  <<: *hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - internal

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge

volumes:
  repo:
  redis-data:

services:
  repo-sync:
    <<: *hardening
    build:
      context: ./repo-sync
    image: ask-the-code/repo-sync:local
    environment:
      GIT_REPO_URL: ${GIT_REPO_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - repo:/repo
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/app:size=8m,mode=0755,uid=1000,gid=1000
    networks:
      - internal

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # MCP servers (internal network only — never published to host)
  # ---------------------------------------------------------------------------
  claude-code-mcp:
    <<: *mcp-base
    build:
      context: ./claude-code-mcp
    image: ask-the-code/claude-code-mcp:local
    environment:
      REPO_DIR: /repo
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MAX_READ_BYTES: ${MAX_READ_BYTES:-262144}
      MAX_GREP_RESULTS: ${MAX_GREP_RESULTS:-200}
      MAX_GLOB_RESULTS: ${MAX_GLOB_RESULTS:-500}
    volumes:
      - repo:/repo:ro
    depends_on:
      repo-sync:
        condition: service_healthy

  companies-mcp:
    <<: *mcp-base
    build:
      context: ./companies-mcp
    image: ask-the-code/companies-mcp:local
    environment:
      COMPANIES_DB_URL: ${COMPANIES_DB_URL}
      COMPANIES_TABLE: ${COMPANIES_TABLE:-companies}
      COMPANIES_NAME_COLUMN: ${COMPANIES_NAME_COLUMN:-name}
      COMPANIES_ID_COLUMN: ${COMPANIES_ID_COLUMN:-id}
      COMPANIES_STATUS_COLUMN: ${COMPANIES_STATUS_COLUMN:-status}
      COMPANIES_CREATED_AT_COLUMN: ${COMPANIES_CREATED_AT_COLUMN:-created_at}
      COMPANIES_MAX_LIMIT: ${COMPANIES_MAX_LIMIT:-5}

  postgres-mcp:
    <<: *mcp-base
    build:
      context: ./postgres-mcp
    image: ask-the-code/postgres-mcp:local
    environment:
      OPERATIONS_DB_URL: ${OPERATIONS_DB_URL}
      CONVERSATIONS_TABLE: ${CONVERSATIONS_TABLE:-conversations}
      CONFIGS_TABLE: ${CONFIGS_TABLE:-company_configs}
      MAX_CONVERSATIONS: ${MAX_CONVERSATIONS:-100}
      MAX_CONFIGS: ${MAX_CONFIGS:-50}
      SENSITIVE_KEY_PATTERN: ${SENSITIVE_KEY_PATTERN:-(secret|token|password|api_key|apikey)}

  mongo-mcp:
    <<: *mcp-base
    build:
      context: ./mongo-mcp
    image: ask-the-code/mongo-mcp:local
    environment:
      MONGO_URL: ${MONGO_URL}
      MONGO_DB: ${MONGO_DB:-operations}
      MONGO_AUDIT_COLLECTION: ${MONGO_AUDIT_COLLECTION:-audit_logs}
      MONGO_MESSAGES_COLLECTION: ${MONGO_MESSAGES_COLLECTION:-messages}
      MAX_AUDIT_LOGS: ${MAX_AUDIT_LOGS:-100}
      MAX_MESSAGES: ${MAX_MESSAGES:-200}
      MAX_MESSAGE_SEARCH: ${MAX_MESSAGE_SEARCH:-50}

  s3-mcp:
    <<: *mcp-base
    build:
      context: ./s3-mcp
    image: ask-the-code/s3-mcp:local
    environment:
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAX_FLOW_BYTES: ${MAX_FLOW_BYTES:-1048576}
      MAX_FLOWS: ${MAX_FLOWS:-100}

  # ---------------------------------------------------------------------------
  # Orchestrator — the only externally-exposed service.
  # ---------------------------------------------------------------------------
  orchestrator:
    <<: *hardening
    build:
      context: ./orchestrator
    image: ask-the-code/orchestrator:local
    environment:
      # Force HF/transformers to use the cache baked at build time.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Wiring
      CODE_MCP_URL: http://claude-code-mcp:3000/sse
      COMPANIES_MCP_URL: http://companies-mcp:3000/sse
      POSTGRES_MCP_URL: http://postgres-mcp:3000/sse
      MONGO_MCP_URL: http://mongo-mcp:3000/sse
      S3_MCP_URL: http://s3-mcp:3000/sse
      REDIS_URL: redis://redis:6379/0
      ENABLE_DIAGNOSTICS: ${ENABLE_DIAGNOSTICS:-true}
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-4096}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-180}
      REWRITE_MAX_TOKENS: ${REWRITE_MAX_TOKENS:-2048}
      MAX_REWRITE_ATTEMPTS: ${MAX_REWRITE_ATTEMPTS:-2}
      DIAGNOSTICS_AGENT_MAX_ITERS: ${DIAGNOSTICS_AGENT_MAX_ITERS:-30}
      # Rate limits
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-30}
      DIAGNOSTICS_RATE_LIMIT_PER_HOUR: ${DIAGNOSTICS_RATE_LIMIT_PER_HOUR:-60}
      # Input scanners
      INPUT_TOKEN_LIMIT: ${INPUT_TOKEN_LIMIT:-2000}
      PROMPT_INJECTION_THRESHOLD: ${PROMPT_INJECTION_THRESHOLD:-0.5}
      INPUT_TOXICITY_THRESHOLD: ${INPUT_TOXICITY_THRESHOLD:-0.7}
      BANNED_TOPICS: ${BANNED_TOPICS:-personal advice,medical,legal,financial advice}
      DIAGNOSTICS_BANNED_TOPICS: ${DIAGNOSTICS_BANNED_TOPICS:-delete data,drop table,modify records,change configuration}
      # Output scanners
      OUTPUT_TOXICITY_THRESHOLD: ${OUTPUT_TOXICITY_THRESHOLD:-0.7}
      OUTPUT_BIAS_THRESHOLD: ${OUTPUT_BIAS_THRESHOLD:-0.7}
      MALICIOUS_URL_THRESHOLD: ${MALICIOUS_URL_THRESHOLD:-0.7}
      OUTPUT_BLOCK_REGEX_PATTERNS: ${OUTPUT_BLOCK_REGEX_PATTERNS:-[]}
      OUTPUT_REDACT_REGEX_PATTERNS: ${OUTPUT_REDACT_REGEX_PATTERNS:-[]}
      ENABLE_NO_REFUSAL: ${ENABLE_NO_REFUSAL:-false}
      # Observability (optional)
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/app:size=16m,mode=0755,uid=1000,gid=1000
    depends_on:
      redis:
        condition: service_healthy
      claude-code-mcp:
        condition: service_started
      companies-mcp:
        condition: service_started
      postgres-mcp:
        condition: service_started
      mongo-mcp:
        condition: service_started
      s3-mcp:
        condition: service_started
    networks:
      - internal
      - edge
